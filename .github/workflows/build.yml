name: Build AutoAim APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: unzip AutoAim.zip -d .
      - name: Download Model AI
        run: |
          mkdir -p AutoAim/app/src/main/assets
          wget https://github.com/neso613/yolo-v5-tflite-model/raw/main/model/yolov5s_f16.tflite -O AutoAim/app/src/main/assets/detect.tflite
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 7.5 }
      - name: Build with Gradle
        run: |
          cd AutoAim
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoAim-APK
          path: AutoAim/app/build/outputs/apk/debug/app-debug.apk
