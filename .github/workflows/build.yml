name: Build Light Aim APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: unzip LightAim.zip -d .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          cd LightAim
          chmod +x gradlew || echo "no gradlew" # Dự án mới chưa có gradlew, cần tạo bằng lệnh dưới
          gradle wrapper --gradle-version 7.5
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LightAim-APK
          path: LightAim/app/build/outputs/apk/debug/app-debug.apk
